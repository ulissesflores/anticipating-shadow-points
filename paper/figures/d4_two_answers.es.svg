<text x="580" y="480" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#1b1b1b" text-anchor="start">Los despliegues graduales rechazan</text>
<text x="580" y="505.08" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#1b1b1b" text-anchor="start">tokens nuevos</text>
<text x="566" y="544" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#5c5c5c" text-anchor="end">8</text>
<text x="580" y="544" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#1b1b1b" text-anchor="start">Se rompen subclases e introspección</text>
<text x="566" y="582" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#5c5c5c" text-anchor="end">9</text>
<text x="580" y="582" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#1b1b1b" text-anchor="start">Las bibliotecas dependientes cambian de</text>
