name: ASP CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  provenance:
    name: Verify seal, then replicate (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 1. Verify the committed SHA-256 seal (stdlib only, before installing anything)
        run: python make_provenance.py --verify
      - name: Install pinned requirements
        run: pip install -r requirements.txt
      - name: 2. Replicate end to end (results -> figures -> tests -> seal -> verify)
        run: python run_all.py
      - name: 3. Derived results must equal the committed ones
        run: git diff --exit-code output/results.json
      - name: Benchmark package tests
        run: PYTHONPATH=benchmark/src python -m pytest -q benchmark/tests

  lint-python:
    name: Python lint (ruff, docstring coverage 100%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff interrogate
      - run: ruff format --check
      - run: ruff check
      - run: interrogate -c pyproject.toml analysis tests/conftest.py tests/test_*.py run_all.py make_provenance.py

  yaml-lint:
    name: YAML lint (frontmatters)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure yq (preinstalled on GitHub runners; snap as fallback, no download-and-run)
        run: command -v yq || sudo snap install yq
      - name: Validate SKILL.md frontmatter
        run: |
          SKILL_FILE=skills/anticipating-shadow-points/SKILL.md
          awk '/^---$/{i++; if(i==2)exit} i==1' "$SKILL_FILE" | tail -n +2 | yq -e '.name' && yq -e '.description' <(awk '/^---$/{i++; if(i==2)exit} i==1' "$SKILL_FILE" | tail -n +2)
      - name: Validate command frontmatter
        run: |
          for f in commands/*.md; do
            awk '/^---$/{i++; if(i==2)exit} i==1' "$f" | tail -n +2 | yq -e '.description' || exit 1
          done
      - name: Validate plugin.json
        run: |
          jq -e '.name and .description and .version' .claude-plugin/plugin.json
      - name: Validate marketplace.json
        run: |
          jq -e '.name and .description and .plugins' .claude-plugin/marketplace.json

  shellcheck:
    name: Shellcheck scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: |
          sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh

  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v15
        with:
          globs: '**/*.md'
        continue-on-error: true

  verify:
    name: Run scripts/verify.sh --pre-install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run verify in pre-install mode (skips criterion 13 staging check)
        run: bash scripts/verify.sh --pre-install
